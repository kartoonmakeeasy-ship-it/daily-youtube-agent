name: Daily Video Agent

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create test video
        run: |
          ffmpeg -y \
            -f lavfi -i color=c=white:s=1280x720:d=5 \
            -f lavfi -i sine=frequency=440:duration=5 \
            -c:v libx264 \
            -c:a aac \
            -pix_fmt yuv420p \
            daily-video.mp4

          ls -lh daily-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: daily-video.mp4
          if-no-files-found: error
