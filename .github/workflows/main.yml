name: Kids Video

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create colorful kids video
        run: |
          ffmpeg -y \
            -f lavfi -i "color=c=lightblue:s=1280x720:d=12" \
            -vf "drawbox=x=0:y=0:w=1280:h=720:color=lightgreen@0.35:t=fill,drawtext=text='Meri Pyari Kahani':fontcolor=black:fontsize=60:x=(w-text_w)/2:y=250,drawtext=text='Ek nayi kids adventure!':fontcolor=black:fontsize=42:x=(w-text_w)/2:y=350" \
            -f lavfi -i "sine=frequency=523:duration=12" \
            -c:v libx264 -c:a aac -pix_fmt yuv420p \
            kids-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: kids-video
          path: kids-video.mp4
